<text x="334" y="163" font-size="13" fill="#5B6270" font-weight="400" text-anchor="start">真实经历</text>
<rect x="490" y="237" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#7048E8" stroke-width="1.6"/>
